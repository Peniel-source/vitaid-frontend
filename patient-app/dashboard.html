<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaID — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="fade-in">
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="header">
    <span class="logo">VitaID</span>
    <span class="link" onclick="handleLogout()">Log out</span>
</div>

<div id="toast-container" class="toast-container"></div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal-content"></div>
</div>

<div class="dash-wrapper" id="app" style="display: none;">
    <div class="dash-header fade-in stagger-1">
        <div>
            <h1 id="patient-name">—</h1>
            <span class="mono vitaid-ref" id="vitaid-ref"></span>
        </div>
        <button class="btn-accent" onclick="window.location.href='add-record.html'">+ Add to profile</button>
    </div>

    <div class="dash-grid">
        <div class="fade-in stagger-2">
            <div class="card glass">
                <div class="card-header-strip">
                    <h2>Golden Card</h2>
                    <span class="subtitle">Emergency-ready summary</span>
                </div>
                <div class="card-body">
                    <div id="critical-alerts"></div>

                    <div class="gc-field">
                        <div class="gc-label">Blood type</div>
                        <div class="gc-value" id="blood-type">—</div>
                    </div>

                    <div class="gc-field">
                        <div class="gc-label">Allergies</div>
                        <div id="allergies-list"></div>
                    </div>

                    <div class="gc-field">
                        <div class="gc-label">Current medications</div>
                        <div id="medications-list"></div>
                    </div>

                    <div class="gc-field">
                        <div class="gc-label">Chronic conditions</div>
                        <div id="conditions-list"></div>
                    </div>

                    <div class="gc-field">
                        <div class="gc-label">Emergency contact</div>
                        <div id="contacts-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="fade-in stagger-3">
            <div class="card glass">
                <div class="card-body">
                    <h2 class="section-title">Profile completeness</h2>
                    <div class="ring-stat">
                        <div class="ring-wrap">
                            <div class="ring" id="ring" style="--pct: 0;"></div>
                            <div class="ring-inner"><span id="ring-text">0%</span></div>
                        </div>
                        <div>
                            <p class="text-muted-sm" id="completeness-hint">Loading…</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card glass">
                <div class="card-body">
                    <h2 style="margin-bottom: 0.9rem;">Quick actions</h2>
                    <div class="tile-grid">
                        <button class="tile" onclick="window.location.href='add-record.html'">
                            <i data-lucide="plus" class="tile-icon"></i>Add allergy or medication
                        </button>
                        <button class="tile" onclick="window.location.href='consent.html'">
                            <i data-lucide="shield-check" class="tile-icon"></i>Manage consent
                        </button>
                        <button class="tile" onclick="window.location.href='audit-log.html'">
                            <i data-lucide="clipboard-list" class="tile-icon"></i>Access history
                        </button>
                        <button class="tile" onclick="showQr()">
                            <i data-lucide="qr-code" class="tile-icon"></i>Show my QR
                        </button>
                    </div>
                </div>
            </div>

            <div class="card glass">
                <div class="card-body">
                    <h2 style="margin-bottom: 0.5rem;">Recent activity</h2>
                    <div id="recent-activity">
                        <p class="text-muted-sm">Loading…</p>
                    </div>
                    <div class="recent-activity-footer">
                        <span class="link text-muted-xs" onclick="window.location.href='audit-log.html'">View full history →</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    if (!localStorage.getItem('vitaid_token')) {
        window.location.href = 'index.html';
    }

    function renderCriticalAlerts(goldenCard) {
        const el = document.getElementById('critical-alerts');
        const severe = (goldenCard.allergies || []).filter((a) => a.severity === 'severe');
        el.innerHTML = severe.map((a) =>
            `<div class="critical-alert critical-pulse">⚠ Severe allergy: ${a.value}</div>`
        ).join('') + (goldenCard.dnrStatus ? '<div class="critical-alert critical-pulse">⚠ DNR on file</div>' : '');
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast--${type}`;
        const icon = type === 'success' ? 'check-circle' : 'alert-circle';
        toast.innerHTML = `<i data-lucide="${icon}"></i><span>${message}</span>`;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(20px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function openModal(contentHtml) {
        const overlay = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-content');
        content.innerHTML = contentHtml;
        overlay.classList.add('active');
        lucide.createIcons();
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('modal-overlay')) return;
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function renderList(elementId, items, formatFn) {
        const el = document.getElementById(elementId);
        if (items.length === 0) {
            el.innerHTML = '<p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 0.3rem;">None recorded</p>';
            return;
        }
        el.innerHTML = items.map(formatFn).join('');
    }

    function timeAgo(dateStr) {
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return `${mins}m ago`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.floor(hours / 24)}d ago`;
    }

    async function loadDashboard() {
        try {
            const profile = await api.getMe();
            document.getElementById('patient-name').textContent = profile.fullName;
            document.getElementById('vitaid-ref').textContent = profile.vitaIdRef;

            const goldenCard = profile.profile.goldenCard;
            const pct = profile.profile.completenessScore;

            // Trigger animation
            setTimeout(() => {
                document.getElementById('ring').style.setProperty('--pct', pct);
                document.getElementById('ring-text').textContent = `${pct}%`;
            }, 100);

            document.getElementById('completeness-hint').textContent =
                pct === 100
                    ? 'Your profile is fully complete, including clinical verification.'
                    : pct >= 85
                        ? 'Great progress. Full completion needs a clinic visit to verify your data.'
                        : 'Add more details so responders have the fullest picture in an emergency.';

            renderCriticalAlerts(goldenCard);
            document.getElementById('blood-type').textContent = goldenCard.bloodType || 'Not set';

            renderList('allergies-list', goldenCard.allergies, (a) => `
          <div class="gc-list-item">
            <span class="badge">${a.source === 'CLINICAL' ? 'Verified' : 'Self-reported'}</span>
            ${a.value}${a.severity === 'severe' ? ' ⚠' : ''}
          </div>
        `);

            renderList('medications-list', goldenCard.currentMedications, (m) => `
          <div class="gc-list-item">
            <span class="badge">${m.source === 'CLINICAL' ? 'Verified' : 'Self-reported'}</span>
            ${m.value}${m.dosage ? ` (${m.dosage})` : ''}
          </div>
        `);

            renderList('conditions-list', goldenCard.chronicConditions, (c) => `
          <div class="gc-list-item">
            <span class="badge">${c.source === 'CLINICAL' ? 'Verified' : 'Self-reported'}</span>
            ${c.value}
          </div>
        `);

            renderList('contacts-list', goldenCard.emergencyContacts, (c) => `
          <div class="gc-list-item">${c.name} (${c.relationship}) — ${c.phoneNumber}</div>
        `);

            document.getElementById('app').style.display = 'block';
            lucide.createIcons();

            try {
                const logs = await api.getAuditLog();
                const recent = logs.slice(0, 4);
                const activityEl = document.getElementById('recent-activity');
                if (recent.length === 0) {
                    activityEl.innerHTML = '<p style="color: var(--color-text-muted); font-size: 0.88rem;">No activity yet.</p>';
                } else {
                    activityEl.innerHTML = recent.map((log) => `
              <div class="activity-item">
                <div class="who">${log.institutionName}</div>
                <div>${log.actionType.replace(/_/g, ' ').toLowerCase()}</div>
                <div class="when">${timeAgo(log.timestamp)}</div>
              </div>
            `).join('');
                }
            } catch (err) {
                showToast('Could not load activity: ' + err.message, 'error');
            }
        } catch (err) {
            showToast('Could not load profile: ' + err.message, 'error');
        }
    }

    function showQr() {
        const ref = localStorage.getItem('vitaid_ref');
        openModal(`
            <div style="text-align: center;">
                <h3 class="section-title" style="margin-bottom: 1.5rem;">Your VitaID Reference</h3>
                <div style="background: white; padding: 1.5rem; border-radius: 24px; display: inline-block; margin-bottom: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 8px solid #fff;">
                    <div id="qrcode"></div>
                </div>
                <div class="mono" style="font-size: 1.8rem; font-weight: 700; color: var(--color-primary); letter-spacing: 0.05em;">${ref}</div>
                <p class="text-muted-sm" style="margin-top: 1.5rem; font-size: 1rem;">Show this to a responder or medical professional to grant access to your Golden Card.</p>
                <button class="btn-primary" onclick="closeModal()" style="margin-top: 2.5rem; height: 3.5rem;">Close</button>
            </div>
        `);
        
        new QRCode(document.getElementById("qrcode"), {
            text: ref,
            width: 240,
            height: 240,
            colorDark : "#03363D",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    function handleLogout() {
        api.logout().finally(() => {
            localStorage.removeItem('vitaid_token');
            localStorage.removeItem('vitaid_ref');
            window.location.href = 'index.html';
        });
    }

    loadDashboard();
</script>
</body>
</html>

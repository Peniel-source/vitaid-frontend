<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaID — Add to Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .tab-btn {
            width: auto; margin: 0; padding: 0.6rem 1.1rem; font-size: 0.88rem;
            background: white; color: var(--color-primary); border: 1.5px solid var(--color-border);
        }
        .tab-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .success-banner {
            background: #EAF7E0; border: 1.5px solid var(--color-accent); color: var(--color-primary);
            border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 1rem; font-weight: 600; display: none;
        }
        .success-banner.visible { display: block; }
        .interaction-warning {
            background: #FDECEA; border: 1.5px solid var(--color-critical); color: var(--color-critical);
            border-radius: 8px; padding: 1rem; margin-top: 1rem; display: none;
        }
        .interaction-warning.visible { display: block; }
    </style>
</head>
<body>
<div class="header">
    <span class="logo" style="cursor: pointer;" onclick="window.location.href='dashboard.html'">VitaID</span>
    <span class="link" onclick="window.location.href='dashboard.html'">← Back to dashboard</span>
</div>

<div class="dash-wrapper" style="max-width: 640px;">
    <h1 style="font-size: 1.9rem; margin-bottom: 1.5rem;">Add to your profile</h1>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="blood">Blood type</button>
        <button class="tab-btn" data-tab="allergy">Allergy</button>
        <button class="tab-btn" data-tab="medication">Medication</button>
        <button class="tab-btn" data-tab="condition">Condition</button>
        <button class="tab-btn" data-tab="contact">Emergency contact</button>
    </div>

    <div class="card"><div class="card-body">

        <div class="success-banner" id="success-banner"></div>

        <!-- Blood type -->
        <div class="tab-panel active" id="tab-blood">
            <form id="blood-form">
                <label for="bloodType">Blood type</label>
                <select id="bloodType" required>
                    <option value="">Select…</option>
                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                </select>
                <button type="submit" class="btn-primary">Save blood type</button>
            </form>
        </div>

        <!-- Allergy -->
        <div class="tab-panel" id="tab-allergy">
            <form id="allergy-form">
                <label for="allergyValue">Allergen</label>
                <input type="text" id="allergyValue" placeholder="e.g. Penicillin" required />

                <label for="allergySeverity">Severity</label>
                <select id="allergySeverity" required>
                    <option value="mild">Mild</option>
                    <option value="moderate">Moderate</option>
                    <option value="severe">Severe</option>
                </select>

                <label for="allergyReaction">Reaction type (optional)</label>
                <input type="text" id="allergyReaction" placeholder="e.g. Anaphylaxis" />

                <button type="submit" class="btn-primary">Add allergy</button>
            </form>
            <button class="btn-secondary" style="margin-top: 0.75rem;" onclick="confirmNone('allergies')">I have no known allergies</button>
        </div>

        <!-- Medication -->
        <div class="tab-panel" id="tab-medication">
            <form id="medication-form">
                <label for="medValue">Medication name</label>
                <input type="text" id="medValue" placeholder="e.g. Warfarin" required />

                <label for="medDosage">Dosage (optional)</label>
                <input type="text" id="medDosage" placeholder="e.g. 5mg" />

                <label for="medFrequency">Frequency (optional)</label>
                <input type="text" id="medFrequency" placeholder="e.g. daily" />

                <button type="submit" class="btn-primary">Add medication</button>
            </form>
            <button class="btn-secondary" style="margin-top: 0.75rem;" onclick="confirmNone('medications')">I'm not on any medications</button>
            <div class="interaction-warning" id="interaction-warning"></div>
        </div>

        <!-- Condition -->
        <div class="tab-panel" id="tab-condition">
            <form id="condition-form">
                <label for="conditionValue">Condition</label>
                <input type="text" id="conditionValue" placeholder="e.g. Type 2 Diabetes" required />

                <label for="conditionStatus">Status</label>
                <select id="conditionStatus" required>
                    <option value="active">Active</option>
                    <option value="managed">Managed</option>
                    <option value="resolved">Resolved</option>
                </select>

                <button type="submit" class="btn-primary">Add condition</button>
            </form>
            <button class="btn-secondary" style="margin-top: 0.75rem;" onclick="confirmNone('conditions')">I have no chronic conditions</button>
        </div>

        <!-- Emergency contact -->
        <div class="tab-panel" id="tab-contact">
            <form id="contact-form">
                <label for="contactName">Full name</label>
                <input type="text" id="contactName" required />

                <label for="contactRelationship">Relationship</label>
                <input type="text" id="contactRelationship" placeholder="e.g. Sister" required />

                <label for="contactPhone">Phone number</label>
                <input type="tel" id="contactPhone" placeholder="+250788123456" required />

                <button type="submit" class="btn-primary">Add contact</button>
            </form>
        </div>

    </div></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    if (!localStorage.getItem('vitaid_token')) window.location.href = 'index.html';

    document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            document.getElementById('success-banner').classList.remove('visible');
            document.getElementById('interaction-warning').classList.remove('visible');
        });
    });

    function showSuccess(msg) {
        const el = document.getElementById('success-banner');
        el.textContent = msg;
        el.classList.add('visible');
    }

    async function confirmNone(type) {
        try {
            if (type === 'allergies') await api.confirmNoAllergies();
            if (type === 'medications') await api.confirmNoMedications();
            if (type === 'conditions') await api.confirmNoConditions();
            showSuccess('Saved. Your profile completeness has been updated.');
        } catch (err) {
            alert(err.message);
        }
    }

    document.getElementById('blood-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.setBloodType(document.getElementById('bloodType').value);
            showSuccess('Blood type saved.');
        } catch (err) { alert(err.message); }
    });

    document.getElementById('allergy-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.addAllergy({
                value: document.getElementById('allergyValue').value.trim(),
                severity: document.getElementById('allergySeverity').value,
                reactionType: document.getElementById('allergyReaction').value.trim() || undefined,
            });
            showSuccess('Allergy added to your profile.');
            e.target.reset();
        } catch (err) { alert(err.message); }
    });

    document.getElementById('medication-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const warningEl = document.getElementById('interaction-warning');
        warningEl.classList.remove('visible');

        try {
            const result = await api.addMedication({
                value: document.getElementById('medValue').value.trim(),
                dosage: document.getElementById('medDosage').value.trim() || undefined,
                frequency: document.getElementById('medFrequency').value.trim() || undefined,
            });

            if (result.blocked) {
                warningEl.innerHTML = `<strong>⚠ Potential interaction detected</strong><br>` +
                    result.interactions.map((i) => `${i.withMedication}: ${i.description}`).join('<br>') +
                    `<br><br>If you understand the risk and want to proceed, tap Add medication again.`;
                warningEl.classList.add('visible');
                window._acknowledgeNext = true;
                return;
            }

            showSuccess('Medication added to your profile.' + (result.interactions ? ' Note: an interaction was recorded — please discuss with your doctor.' : ''));
            e.target.reset();
            window._acknowledgeNext = false;
        } catch (err) { alert(err.message); }
    });

    document.getElementById('condition-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.addCondition({
                value: document.getElementById('conditionValue').value.trim(),
                status: document.getElementById('conditionStatus').value,
            });
            showSuccess('Condition added to your profile.');
            e.target.reset();
        } catch (err) { alert(err.message); }
    });

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.addEmergencyContact({
                name: document.getElementById('contactName').value.trim(),
                relationship: document.getElementById('contactRelationship').value.trim(),
                phoneNumber: document.getElementById('contactPhone').value.trim(),
            });
            showSuccess('Emergency contact added.');
            e.target.reset();
        } catch (err) { alert(err.message); }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaID — Manage Consent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="fade-in">
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="header">
    <span class="logo" onclick="window.location.href='dashboard.html'">VitaID</span>
    <span class="link" onclick="window.location.href='dashboard.html'">← Back to dashboard</span>
</div>

<div id="toast-container" class="toast-container"></div>
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal-content"></div>
</div>

<div class="dash-wrapper" style="max-width: 700px;">
    <h1 class="fade-in stagger-1" style="font-size: 1.9rem; margin-bottom: 0.4rem;">Manage consent</h1>
    <p class="text-muted-sm fade-in stagger-1" style="margin-bottom: 1.5rem;">Control which facilities can submit and access your health records.</p>

    <div class="card card--surface glass fade-in stagger-2">
        <div class="card-body">
            <h2 class="section-title" style="font-size: 1.15rem;">Grant new consent</h2>
            <form id="grant-form" style="display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 220px;">
                    <label for="facilityId" style="margin-top: 0;">Facility ID</label>
                    <input type="text" id="facilityId" placeholder="Provided by the clinic/hospital" required />
                </div>
                <button type="submit" class="btn-primary btn-small" style="margin-top: 0;">Grant access</button>
            </form>
            <div id="grant-error" class="error-text"></div>
        </div>
    </div>

    <div class="card glass fade-in stagger-3">
        <div class="card-header-strip">
            <h2>Your consent records</h2>
        </div>
        <div class="card-body" id="consent-list">
            <p style="color: var(--color-text-muted);">Loading…</p>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    if (!localStorage.getItem('vitaid_token')) window.location.href = 'index.html';

    let patientId = null;

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast--${type}`;
        const icon = type === 'success' ? 'check-circle' : 'alert-circle';
        toast.innerHTML = `<i data-lucide="${icon}"></i><span>${message}</span>`;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(20px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function openModal(contentHtml) {
        const overlay = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-content');
        content.innerHTML = contentHtml;
        overlay.classList.add('active');
        lucide.createIcons();
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('modal-overlay')) return;
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function formatDate(d) {
        return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function loadConsents() {
        const listEl = document.getElementById('consent-list');
        try {
            const consents = await api.listConsents(patientId);
            if (consents.length === 0) {
                listEl.innerHTML = '<p style="color: var(--color-text-muted);">No consent records yet. Grant access to a facility above once they give you their facility ID.</p>';
                return;
            }
            listEl.innerHTML = consents.map((c) => `
          <div class="consent-item">
            <div>
              <div class="consent-facility">${c.facility.name}</div>
              <div class="consent-meta">${c.facility.facilityType} · granted ${formatDate(c.grantedAt)}${c.revokedAt ? ` · revoked ${formatDate(c.revokedAt)}` : ''}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span class="status-pill ${c.isActive ? 'status-active' : 'status-revoked'}">${c.isActive ? 'Active' : 'Revoked'}</span>
              ${c.isActive ? `<button class="btn-small btn-revoke" onclick="revoke('${c.facilityId}')">Revoke</button>` : ''}
            </div>
          </div>
        `).join('');
        } catch (err) {
            listEl.innerHTML = `<p style="color: var(--color-critical);">${err.message}</p>`;
        }
    }

    async function revoke(facilityId) {
        openModal(`
            <h2 class="section-title">Revoke access?</h2>
            <p>This facility will no longer be able to submit new records or view your Golden Card.</p>
            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button class="btn-primary" onclick="confirmRevoke('${facilityId}')">Yes, revoke</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        `);
    }

    async function confirmRevoke(facilityId) {
        try {
            await api.revokeConsent(patientId, facilityId);
            closeModal();
            showToast('Consent revoked.');
            loadConsents();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    document.getElementById('grant-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.grantConsent(patientId, document.getElementById('facilityId').value.trim());
            document.getElementById('facilityId').value = '';
            showToast('Access granted successfully.');
            loadConsents();
        } catch (err) {
            showToast(err.message, 'error');
        }
    });

    async function init() {
        try {
            const profile = await api.getMe();
            patientId = profile.id;
            loadConsents();
            lucide.createIcons();
        } catch (err) {
            showToast('Could not load profile: ' + err.message, 'error');
        }
    }

    init();
</script>
</body>
</html>

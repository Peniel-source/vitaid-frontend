<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaID Responder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="container" style="padding-top: 3rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 2rem;">VitaID</h1>
        <p style="color: var(--color-text-muted); margin-top: 0.4rem;">Responder Access</p>
    </div>

    <div class="card">
        <form id="login-form">
            <label for="email">Work email</label>
            <input type="email" id="email" required autocomplete="username" />

            <label for="workId">Work ID</label>
            <input type="text" id="workId" required autocomplete="current-password" />

            <div id="error" class="error-text"></div>

            <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
        </form>
    </div>

    <p style="text-align: center; color: var(--color-text-muted); font-size: 0.9rem;">
        Institution-credentialed responders only.
    </p>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    if (localStorage.getItem('responder_token')) {
        window.location.href = 'search.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submit-btn');
        errorEl.classList.remove('visible');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';

        try {
            const result = await api.login(
                document.getElementById('email').value.trim(),
                document.getElementById('workId').value.trim(),
            );
            localStorage.setItem('responder_token', result.accessToken);
            window.location.href = 'search.html';
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log in';
        }
    });
</script>
</body>
</html>
